<!doctype html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f6f8fc" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <title>PTE CORE AI</title>
  <!-- The card WhatsApp and other apps show for a pasted link, including a shared answer. Generic
       on purpose: the same for every page, so nothing about a shared report is in it. -->
  <meta name="description" content="Practice PTE Core with AI scoring: speaking, writing, reading and listening, with instant feedback." />
  <meta property="og:site_name" content="PTE CORE AI" />
  <meta property="og:title" content="PTE CORE AI - PTE Practice" />
  <meta property="og:description" content="Practice PTE Core with AI scoring: speaking, writing, reading and listening, with instant feedback." />
  <meta property="og:type" content="website" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600;700&display=swap"
  />
  <script>
    (function () {
      var saved = localStorage.getItem("pte_theme");
      var theme = saved === "dark" || saved === "light"
        ? saved
        : (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
      document.documentElement.dataset.theme = theme;
      document.querySelector('meta[name="theme-color"]').setAttribute("content", theme === "dark" ? "#0f1424" : "#f6f8fc");
    })();
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>

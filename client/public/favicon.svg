<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-label="PTE CORE AI">
  <!-- The sidebar logomark, redrawn for the browser tab.
       The "P" is a path rather than a text element: a favicon cannot load the web font the
       app uses, and a system font fallback renders at a different weight and width on every
       platform. The indigo and violet below are the brand gradient, written as literal hex
       because an SVG loaded as an icon gets none of the app stylesheet, so a CSS variable
       would resolve to nothing. Keep this comment free of doubled hyphens: SVG is parsed as
       strict XML, where they are illegal inside a comment and silently kill the whole file. -->
  <defs>
    <linearGradient id="m" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4F46E5"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="16" fill="url(#m)"/>
  <path fill="#FFFFFF" fill-rule="evenodd"
        d="M19 14 H33 a12 12 0 0 1 0 24 H28 V50 H19 Z
           M28 22 H33 a4 4 0 0 1 0 8 H28 Z"/>
</svg>
